[package]
name = "macos-media"
version = "1.0.0"
edition = "2021"
description = "macOS Stream Deck utilities: Media controls, Mic Mute (0% / 100%), and Microsoft Teams mute / camera"
authors = ["toumorokoshi"]

[[bin]]
name = "macos-media"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
block2 = "0.6"
objc2 = "0.6"
log = "0.4"
env_logger = "0.11"
core-graphics = "0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
